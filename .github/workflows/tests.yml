name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: GambleApp

jobs:
  test:
    name: Jest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GambleApp/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run Jest (CI)
        run: npm run test:ci:hard

      - name: Publish test report to Checks/Tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Jest Tests
          path: GambleApp/reports/jest/junit.xml
          reporter: jest-junit

      - name: Upload JUnit XML (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-junit
          path: GambleApp/reports/jest/junit.xml

  bundle:
    name: JS bundle (Expo/Metro)
    runs-on: ubuntu-latest
    needs: [test]
    env:
      EXPO_NO_INTERACTIVE: "1"
      CI: "1"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GambleApp/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Expo Doctor (warn only)
        run: npx expo-doctor || true
        # remove --yes if you prefer interactive output locally

      - name: Bundle for iOS & Android with Metro
        run: |
          npx expo export \
            --platform android \
            --output-dir dist \
            --dump-sourcemap \
            --non-interactive
        # This proves Metro can produce native bundles & assets.

      - name: Upload bundles (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: expo-bundles
          path: GambleApp/dist

  android-build:
    name: Android compile (debug)
    runs-on: ubuntu-latest
    needs: [test]
    env:
      EXPO_NO_INTERACTIVE: "1"
      CI: "1"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GambleApp/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Setup Java 17 (required by modern AGP)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Prebuild native (android only)
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/android/gradle/wrapper/gradle-wrapper.properties', '**/android/build.gradle', '**/android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Assemble debug (no signing)
        working-directory: GambleApp/android
        run: ./gradlew assembleDebug -x lint -x test

      - name: Upload APK (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: GambleApp/android/app/build/outputs/apk/debug/app-debug.apk
