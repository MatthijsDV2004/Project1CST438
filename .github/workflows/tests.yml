name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Optional: runs Expo project checks (won't fail your build if not installed)
      - name: Expo Doctor (optional)
        run: npx expo-doctor || true

      - name: Type check (optional)
        run: npm run typecheck --if-present

      - name: Lint (optional)
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test -- --ci
